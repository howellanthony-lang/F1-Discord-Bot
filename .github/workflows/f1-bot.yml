name: F1 Discord Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Automation mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - news
          - standings
          - schedule
          - race-weekend
          - all
      force:
        description: "Ignore duplicate and interval checks"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: f1-discord-automation
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate bot repo
        run: python validate_bot.py

      - name: Run F1 automation once
        env:
          BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          SCHEDULE_WEBHOOK: ${{ secrets.SCHEDULE_WEBHOOK }}
          LIVE_TIMING_WEBHOOK: ${{ secrets.LIVE_TIMING_WEBHOOK }}
          FASTEST_LAP_WEBHOOK: ${{ secrets.FASTEST_LAP_WEBHOOK }}
          RACE_CONTROL_WEBHOOK: ${{ secrets.RACE_CONTROL_WEBHOOK }}
          NEWS_WEBHOOK: ${{ secrets.NEWS_WEBHOOK }}
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
          STANDINGS_WEBHOOK: ${{ secrets.STANDINGS_WEBHOOK }}
          RESULTS_WEBHOOK: ${{ secrets.RESULTS_WEBHOOK }}
          SEASON: ${{ vars.SEASON || '2026' }}
          NEWS_LIMIT: ${{ vars.NEWS_LIMIT || '5' }}
          STANDINGS_LIMIT: ${{ vars.STANDINGS_LIMIT || '10' }}
        run: python f1_live_bot.py

      - name: Commit dedupe state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/sent_items.json /tmp/local-sent-items.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("state/sent_items.json")
          local_path = Path("/tmp/local-sent-items.json")

          def load(path):
              if not path.exists():
                  return {"sent": {}, "last_runs": {}}
              with path.open("r", encoding="utf-8") as file:
                  data = json.load(file)
              data.setdefault("sent", {})
              data.setdefault("last_runs", {})
              return data

          remote = load(state_path)
          local = load(local_path)

          for category, items in local.get("sent", {}).items():
              remote.setdefault("sent", {}).setdefault(category, {}).update(items)

          for task_name, timestamp in local.get("last_runs", {}).items():
              existing = remote.setdefault("last_runs", {}).get(task_name)
              if not existing or timestamp > existing:
                  remote["last_runs"][task_name] = timestamp

          state_path.parent.mkdir(exist_ok=True)
          with state_path.open("w", encoding="utf-8") as file:
              json.dump(remote, file, indent=2, sort_keys=True)
              file.write("\n")
          PY
            git add state/sent_items.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "Update F1 bot sent-item state"
            git push && exit 0
            echo "Push failed, merging latest state and retrying..."
          done
          echo "Could not push state after 3 attempts."
          exit 1
